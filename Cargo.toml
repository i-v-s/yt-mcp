[package]
name = "yt-mcp"
version = "0.1.0"
edition = "2024"
description = "Read-only stdio MCP server for YouTrack 2021.3"

[[test]]
name = "stdio_smoke"
path = "src/stdio_smoke.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
rmcp = { version = "3.9", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "fs", "time", "signal", "sync"] }
toml = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"

